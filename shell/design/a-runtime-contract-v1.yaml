    },
    "typography": {
      "decision": "微软雅黑UI；19px标题/14px任务/12px说明；可200%放大",
      "rationale": "中文易读"
    },
    "density": {
      "decision": "最近更新任务直接显示；长文换行不截断正文；不堆无来源占位字段",
      "rationale": "不要求逐项展开"
    },
    "color": {
      "decision": "冷白深墨、蓝绿连接；陶土陈旧；保留A未来实习/工作的语义色，不假造分区",
      "rationale": "颜色只表达真实状态"
    },
    "geometry": {
      "decision": "原生有边框；内部细分隔、无嵌套卡片",
